name: Build RTL8733BS for BBL S905L

on:
  push:
    paths:
      - '.github/workflows/build-rtl8733bs-temp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev make wget unzip git perl python3 file

      - name: Install Android NDK r17c GCC 4.9 aarch64 toolchain
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "$GITHUB_WORKSPACE"
          echo "$GITHUB_WORKSPACE/android-ndk-r17c/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Fetch Amlogic 3.14 kernel
        run: |
          git clone --depth 1 --branch amlogic-3.14-nougat https://github.com/kszaq/linux-amlogic-le.git kernel

      - name: Prepare kernel configuration
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          cd kernel
          # Old 3.14 dtc sources need this with modern host GCC/binutils.
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          make meson64_defconfig
          if [ -x scripts/config ]; then
            scripts/config --enable SMP
            scripts/config --enable PREEMPT
            scripts/config --enable MODULES
            scripts/config --enable MODULE_UNLOAD
            scripts/config --disable MODVERSIONS
            scripts/config --module CFG80211
            scripts/config --module MAC80211
            scripts/config --set-str LOCALVERSION ""
            scripts/config --disable LOCALVERSION_AUTO
            scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          else
            sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' .config
            sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          fi
          yes '' | make oldconfig || true
          make -j2 prepare scripts modules_prepare
          echo "Kernel release: $(make -s kernelrelease)"

      - name: Fetch RTL8733BS vendor driver
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/sipeed/LicheeRV-Nano-Build.git driver-src
          cd driver-src
          git sparse-checkout set osdrv/extdrv/wireless/rtl8733bs
          cd osdrv/extdrv/wireless/rtl8733bs
          sed -i 's/^CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/^CONFIG_PLATFORM_AML_S905 = n/CONFIG_PLATFORM_AML_S905 = y/' Makefile
          sed -i 's/^CONFIG_RTW_ANDROID = 0/CONFIG_RTW_ANDROID = 7/' Makefile

      - name: Build RTL8733BS module
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          DRV="$GITHUB_WORKSPACE/driver-src/osdrv/extdrv/wireless/rtl8733bs"
          make -C "$DRV" KSRC="$GITHUB_WORKSPACE/kernel" ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j2 V=1 2>&1 | tee "$GITHUB_WORKSPACE/rtl8733bs-build.log"
          find "$DRV" -name '*.ko' -print -exec file {} \;
          KO=$(find "$DRV" \( -name '8733bs.ko' -o -name 'rtl8733bs.ko' \) | head -1)
          test -n "$KO"
          cp "$KO" "$GITHUB_WORKSPACE/8733bs.ko"
          strings "$GITHUB_WORKSPACE/8733bs.ko" | grep -E '^vermagic=|^name=|^depends=' | tee "$GITHUB_WORKSPACE/rtl8733bs-module-info.txt" || true
          sha256sum "$GITHUB_WORKSPACE/8733bs.ko" | tee -a "$GITHUB_WORKSPACE/rtl8733bs-module-info.txt"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8733bs-s905l-kernel-3.14.29
          path: |
            8733bs.ko
            rtl8733bs-module-info.txt
            rtl8733bs-build.log
          if-no-files-found: error
