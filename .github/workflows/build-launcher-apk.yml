name: Build BBL.BOXTV Launcher APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: launcher
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp launcher/app/build/outputs/apk/debug/app-debug.apk BBL_BOXTV_Launcher_V2.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BBL_BOXTV_Launcher_V2.1.1
          path: BBL_BOXTV_Launcher_V2.1.1.apk
