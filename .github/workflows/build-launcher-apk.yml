name: Build BBL.BOXTV Launcher APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: launcher
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp launcher/app/build/outputs/apk/debug/app-debug.apk BBL_BOXTV_Launcher_V2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BBL_BOXTV_Launcher_V2.0.0
          path: BBL_BOXTV_Launcher_V2.0.0.apk
