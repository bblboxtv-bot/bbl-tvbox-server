name: Build BBL Launcher V4
on:
  push:
    branches: [rom-v4-launcher-build]
    paths: ['launcher-v4/**','.github/workflows/build-launcher-v4.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: cd launcher-v4 && gradle :app:assembleDebug --no-daemon
      - run: cp launcher-v4/app/build/outputs/apk/debug/app-debug.apk TUDO_LIBERADO_BBL_TELALAUNCHER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TUDO_LIBERADO_BBL_TELALAUNCHER
          path: TUDO_LIBERADO_BBL_TELALAUNCHER.apk
