name: Build Tudo Liberado Acesso APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'resellerapp/**'
      - '.github/workflows/build-reseller-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: resellerapp
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp resellerapp/app/build/outputs/apk/debug/app-debug.apk TUDO_LIBERADO_ACESSO_V2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TUDO_LIBERADO_ACESSO_V2.0.0
          path: TUDO_LIBERADO_ACESSO_V2.0.0.apk
