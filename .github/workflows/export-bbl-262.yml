name: Export BBL Device Owner APK 2.6.2
on:
  push:
    paths:
      - '.github/workflows/export-bbl-262.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from Render
        run: |
          curl -fL --retry 10 --retry-delay 3 "https://bbl-launcher-build-v256b.onrender.com/BBL_BOXTV_2.5.6_ATUALIZAR_CLEAN_UNSIGNED.apk" -o "BBL_BOXTV_2.6.2_DEVICE_OWNER_CONTROLS.apk"
          ls -lh "BBL_BOXTV_2.6.2_DEVICE_OWNER_CONTROLS.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBL_BOXTV_2.6.2_DEVICE_OWNER_CONTROLS
          path: BBL_BOXTV_2.6.2_DEVICE_OWNER_CONTROLS.apk
          if-no-files-found: error
