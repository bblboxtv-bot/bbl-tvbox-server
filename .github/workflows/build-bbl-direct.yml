name: Export BBL 2.6.4 APK

on:
  push:
    branches: [ launcher-v256-build ]
    paths:
      - '.github/workflows/build-bbl-direct.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled APK from BBL build service
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 3 \
            "https://bbl-launcher-build-v256b.onrender.com/BBL_BOXTV_2.5.6_ATUALIZAR_CLEAN_UNSIGNED.apk" \
            -o BBL_BOXTV_2.6.4_AUTOUPDATE_BACK_ONLY.apk
          test -s BBL_BOXTV_2.6.4_AUTOUPDATE_BACK_ONLY.apk
          unzip -t BBL_BOXTV_2.6.4_AUTOUPDATE_BACK_ONLY.apk >/dev/null

      - name: Upload direct APK
        uses: actions/upload-artifact@v4
        with:
          name: BBL_BOXTV_2.6.4_AUTOUPDATE_BACK_ONLY
          path: BBL_BOXTV_2.6.4_AUTOUPDATE_BACK_ONLY.apk
          if-no-files-found: error
