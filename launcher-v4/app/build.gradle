plugins { id 'com.android.application' }

android { namespace 'com.bbl.boxtv.launcherv4'; compileSdk 35
  defaultConfig {
    applicationId 'com.bbl.boxtv.telalauncher'
    minSdk 21
    targetSdk 28
    versionCode 7
    versionName '1.1.0-bbl-tudo-bridge'
    buildConfigField 'String', 'API_BASE_URL', '"https://bbl-tvbox-manager-v2.onrender.com"'
  }
  buildFeatures { buildConfig true }
}
